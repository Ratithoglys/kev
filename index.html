<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kev — Galerie des looks</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      background: #fff;
      color: #222;
    }
    h1 {
      font-size: 22px;
    }
    p {
      color: #555;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    figure {
      margin: 0;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      overflow: hidden;
    }
    img {
      width: 100%;
      display: block;
      background: #fafafa;
    }
    figcaption {
      padding: 10px 12px;
    }
    figcaption span {
      display: block;
      color: #555;
      font-size: 14px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Kev — Galerie des looks</h1>
  <p>Kev, petit robot orange. Un seul détail par occasion, et une icône flottante le jour du changement de saison.</p>
  <div class="grid">
